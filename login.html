<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/criar_curriculo.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html"><img src="./icons/home.ico" alt="" width="24" height="24" class="icones">  Home</a>
            <a href="criar_curriculo.html"><img src="./icons/docs.ico" alt="" width="24" height="24" class="icones">  Criar currículo</a>
            <a href="sign.html" id="sign"><img src="./icons/sign.ico" alt="" width="24" height="24" class="icones">Sign</a>
            <a href="login.html" id="login"><img src="./icons/sign.ico" alt="" width="24" height="24" class="icones">login</a>
        </nav>
    </header>
    <div id="form">
        <h1 class="centralizar">Login</h1>
        <form action="index.html">
            <div class="lado-a-lado">
                <div id="dados_pessoas-div">
                    <div id="nickname">
                        <label for="nickname-input">NICKNAME:</label>
                        <br>
                        <input type="text" name="nickname" id="nickname-input" required>
                    </div>
                </div>
            </div>
            <br>
            <div>
                <div>
                    <label for="senha">SENHA:</label>
                    <br>
                    <input type="senha" id="senha" name="senha" class="contato-input" required>
                </div>
            </div>
            <br>
            <div class="lado-a-lado botoes">
                <a href="sign.html" class="botao">Voltar</a>
                <button type="submit">login</button>
            </div>
        </form>
    </div>

    <footer>
        <p>Projeto desenvolvido para a disciplina de Programação Web Front-end</p>
        <p><a href="https://igorpitoli007.github.io/curriculo/">Igor Rafael Pitoli</a> - <a href="https://www.linkedin.com/in/eduardo-de-souza-oller-25468441b/">Eduardo de Souza Oller</a></p> 
    </footer>
    <script>
        const formLogin = document.querySelector('form');

        formLogin.addEventListener('submit', (e) => {
            e.preventDefault();

            const nickname = document.getElementById('nickname-input').value.trim();
            const senha = document.getElementById('senha').value;
            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            const usuarioEncontrado = usuarios.find((u) => u.nickname === nickname && u.senha === senha);
            if (!usuarioEncontrado) {
                alert('Nickname ou senha incorretos.');
                return;
            }
            const sessao = {
                logado: true,
                nickname: usuarioEncontrado.nickname,
                nome: usuarioEncontrado.nome,
                sobrenome: usuarioEncontrado.sobrenome,
                email: usuarioEncontrado.email
            };
            sessionStorage.setItem('sessao', JSON.stringify(sessao));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
