<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar currículo</title>
    <link rel="stylesheet" href="./css/criar_curriculo.css">
</head>
<body>
   <nav>
        <a href="index.html"><img src="./icons/home.ico" alt="" width="24" height="24">  Home</a>
        <a href="criar_curriculo.html"><img src="./icons/docs.ico" alt="" width="24" height="24">  Criar currículo</a>
    </nav>

    <div class="lado-a-lado">
            <div id="curriculo">
                <div class="curriculo-topo lado-a-lado">
                    <img id="foto-curriculo" src="./img/istockphoto-178849467-170x170.jpg" alt="Foto do currículo">

                    <div class="curriculo-titulo">
                        <div class="lado-a-lado">
                            <p id="nome-curriculo"></p>
                            <p id="sobrenome-curriculo"></p>
                        </div>
                    </div>
                </div>

                <div class="curriculo-secao">
                    <h3>Contato</h3>
                    <p>Tel: <span id="telefone-curriculo"></span></p>
                    <p>Email: <span id="email-curriculo"></span></p>
                    <h3>Endereço</h3>
                    <p><span id="cidade-curriculo"></span> - <span id="estado-curriculo"></span></p>
                    <p>CEP: <span id="cep-curriculo"></span></p>
                    <p><span id="endereco-curriculo"></span></p>
                </div>
            </div>
            <div id="form">
                <h1 class="centralizar">Criar currículo</h1>

                <form action="javascript:gerarPdf()" method="">
                    <div class="lado-a-lado">

                        <div id="rosto">
                            <img src="./img/foto_perfil.jpg" alt="">
                            <br>

                            <label for="foto" id="foto-button">Escolha a foto.</label>
                            <input type="file" name="foto" id="foto">
                        </div>

                        <div id="dados_pessoas-div">

                            <div class="lado-a-lado">
                                <div id="nome">
                                    <label for="nome">NOME:</label>
                                    <br>
                                    <input type="text" name="nome" id="nome-input" required>
                                </div>

                                <div id="sobrenome">
                                    <label for="sobrenome">SOBRENOME:</label>
                                    <br>
                                    <input type="text" name="sobrenome" id="sobrenome-input" required>
                                </div>
                            </div>

                            <br>

                            <div id="endereco">
                                <label for="endereco-input">ENDEREÇO:</label>
                                <br>
                                <input type="text" name="endereço" id="endereco-input" required>
                            </div>

                        </div>
                    </div>

                    <div id="regiao" class="lado-a-lado">
                        <br>

                        <div class="regiao-div">
                            <label for="cidade-input">CIDADE:</label>
                            <br>
                            <input type="text" name="cidade" id="cidade-input" class="regiao-input" required>
                        </div>

                        <br>

                        <div class="regiao-div">
                            <label for="estado-input">ESTADO:</label>
                            <br>
                            <input type="text" name="estado" id="estado-input" class="regiao-input" required>
                        </div>

                        <br>

                        <div id="cep">
                            <label for="cep-input">CEP:</label>
                            <br>
                            <input type="text" name="cep" id="cep-input" class="regiao-input" required>
                        </div>
                    </div>

                    <br>

                    <div id="contato" class="lado-a-lado">

                        <div class="contato-div">
                            <label for="telefone">TELEFONE:</label>
                            <br>
                            <input type="text" id="telefone" name="telefone" class="contato-input" pattern="^\(?[1-9]{2}\)?\s?[0-9]{5}-?[0-9]{4}$" maxlength="15" required>
                        </div>

                        <br>

                        <div>
                            <label for="email">EMAIL:</label>
                            <br>
                            <input type="email" id="email" name="email" class="contato-input" required>
                        </div>
                    </div>
                    <br>
                    <div class="lado-a-lado botoes">
                        <a href="index.html" class="botao">Voltar</a>
                        <button type="submit">Criar Currículo</button>
                    </div>
                </form>
            </div>
    </div>
    <footer>
        <p>Projeto desenvolvido para a disciplina de Programação Web Front-end<p>
        <p><a href="">Igor Rafael Pitoli</a> - Ghabriel Jun Aizawa - <a href="https://www.linkedin.com/in/eduardo-de-souza-oller-25468441b/">Eduardo de Souza Oller</a></p> 
    </footer>
    <script>
        const telefoneInput = document.getElementById('telefone');

        telefoneInput.addEventListener('keypress', (e) => {
            // Permite apenas números
            if (isNaN(e.key)) {
                e.preventDefault();
            }
        });

        telefoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            value = value.replace(/^(\d{2})(\d)/g, '($1) $2');
            value = value.replace(/(\d)(\d{4})$/, '$1-$2');
            e.target.value = value;
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        function gerarPdf(){
            const foto = document.getElementById('foto-curriculo');

            // Garante que a imagem já terminou de carregar antes de "fotografar" o currículo
            const gerar = () => {
                html2pdf(document.getElementById('curriculo'), {
                    margin: 0,
                    filename: 'curriculo.pdf',
                    jsPDF: { format: 'a4' },
                    html2canvas: {
                        useCORS: true,
                        allowTaint: true,
                        scale: 2 // melhora a qualidade da imagem no PDF
                    }
                });
            };

            if (foto.complete) {
                gerar();
            } else {
                foto.onload = gerar;
            }
        }
    </script>
</body>
</html>
