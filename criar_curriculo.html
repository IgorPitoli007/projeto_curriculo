<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar currículo</title>
    <link rel="stylesheet" href="./css/criar_curriculo.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="criar_curriculo.html">Criar currículo</a>
    </nav>

    <div class="lado-a-lado">
        <div id="form">
            <h1 class="centralizar">Criar currículo</h1>

            <form action="index.html" method="">
                <div class="lado-a-lado">

                    <div id="rosto">
                        <img src="./img/istockphoto-178849467-170x170.jpg" alt="">
                        <br>

                        <label for="foto" id="foto-button">Escolha a foto.</label>
                        <input type="file" name="foto" id="foto">
                    </div>

                    <div id="dados_pessoas-div">

                        <div class="lado-a-lado">
                            <div id="nome">
                                <label for="nome">NOME:</label>
                                <br>
                                <input type="text" name="nome" id="nome" required>
                            </div>

                            <div id="sobrenome">
                                <label for="sobrenome">SOBRENOME:</label>
                                <br>
                                <input type="text" name="sobrenome" id="" required>
                            </div>
                        </div>

                        <br>

                        <div id="endereco">
                            <label for="endereço">ENDEREÇO:</label>
                            <br>
                            <input type="text" name="endereço" id="" required>
                        </div>

                    </div>
                </div>

                <div id="regiao" class="lado-a-lado">
                    <br>

                    <div class="regiao-div">
                        <label for="nome">CIDADE:</label>
                        <br>
                        <input type="text" name="Nome" id="" class="regiao-input" required>
                    </div>

                    <br>

                    <div class="regiao-div">
                        <label for="nome">ESTADO:</label>
                        <br>
                        <input type="text" name="Nome" id="" class="regiao-input" required>
                    </div>

                    <br>

                    <div id="cep">
                        <label for="nome">CEP:</label>
                        <br>
                        <input type="text" name="Nome" id="cep" class="regiao-input" required>
                    </div>
                </div>

                <br>

                <div id="contato" class="lado-a-lado">

                    <div class="contato-div">
                        <label for="telefone">TELEFONE:</label>
                        <br>
                        <input type="text" id="telefone" name="telefone" class="contato-input" pattern="^\(?[1-9]{2}\)?\s?[0-9]{5}-?[0-9]{4}$" maxlength="15" required>
                    </div>

                    <br>

                    <div>
                        <label for="email">EMAIL:</label>
                        <br>
                        <input type="email" id="email" name="email" class="contato-input" required>
                    </div>
                </div>
                <br>
                <div class="lado-a-lado botoes">
                    <a href="index.html" class="botao">Voltar</a>
                    <button type="submit">Criar Currículo</button>
                </div>

            </form>
        </div>
    </div>

    <footer>
        <p>
            Projeto desenvolvido para a disciplina de Programação Web Front-end
        </p>

        <a href="curriculo-igor.pdf">Currículo Igor</a>
        <a href="curriculo-amigo.pdf">Currículo Eduardo 2</a>
    </footer>

    <script>
        const telefoneInput = document.getElementById('telefone');

        telefoneInput.addEventListener('keypress', (e) => {
            // Permite apenas números
            if (isNaN(e.key)) {
                e.preventDefault();
            }
        });

        telefoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            value = value.replace(/^(\d{2})(\d)/g, '($1) $2');
            value = value.replace(/(\d)(\d{4})$/, '$1-$2');
            e.target.value = value;
        });
    </script>

</body>
</html>
