<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar currículo</title>
    <link rel="stylesheet" href="./css/criar_curriculo.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="criar_curriculo.html">Criar currículo</a>
    </nav>
    <div class="lado-a-lado">
        <div id="currículo">
            <h1 id="nome_curriculo"></h1>
        </div>
        <div id="form">
            <h1 class="centralizar">Criar currículo</h1>
            <form action="" method="post">
                <div class="lado-a-lado">
                <div id="rosto">
                    <img src="./img/istockphoto-178849467-170x170.jpg" alt="">
                    <br>
                    <input type="file" name="" id="">
                </div>
                <div>
                    <div class="lado-a-lado">
                        <div id="nome">
                            <label for="nome">NOME:</label>
                            <br>
                            <input type="text" name="nome" id="nome">
                        </div>
                        <div id="sobrenome">
                            <label for="sobrenome">SOBRENOME:</label>
                            <br>
                            <input type="text" name="sobrenome" id="">
                        </div>
                    </div>
                    <br>
                    <div id="endereco">
                        <label for="endereço">ENDEREÇO:</label>
                        <br>
                        <input type="text" name="endereço" id="">
                    </div>
                </div>
            </div>
            <div id="regiao" class="lado-a-lado">
                    <br>
                    <div class="regiao-div">
                        <label for="nome">CIDADE:</label>
                        <br>
                        <input type="text" name="Nome" id="" class="regiao-input">
                    </div>
                    <br>
                    <div class="regiao-div">
                        <label for="nome">ESTADO:</label>
                        <br>
                        <input type="text" name="Nome" id="" class="regiao-input">
                    </div>
                    <br>
                    <div id="cep">
                        <label for="nome">CEP:</label>
                        <br>
                        <input type="text" name="Nome" id="cep" class="regiao-input">
                    </div>
            </div>
            <br>
            <div id="contato" class="lado-a-lado">
                <div class="contato-div">
                    <label for="telefone">TELEFONE:</label>
                    <br>
                    <input type="text" id="telefone" name="telefone" class="contato-input" pattern="(?[1-9]{2}\)?\s?[0-9]{4,5}-?[0-9]{4}$">
                </div>
                <br>
                <div>
                    <label for="email">EMAIL:</label>
                    <br>
                    <input type="email" id="email" name="email" class="contato-input">
                </div>
            </div>
            <br>
            <div class="lado-a-lado">
                <button>Voltar</button>
                <button>Criar Currículo</button>
            </div>
            </form>
        </div>
    </div>
    <script>
        const nomeInput = document.getElementById('nome');
        const nomeCurriculo = document.getElementById('nome_curriculo');

        nomeInput.addEventListener('input', (e) => {
           nomeCurriculo.textContent = event.target.value;
        });

    </script>
    <script>
        const telefoneInput = document.getElementById('telefone');

        telefoneInput.addEventListener('keypress', (e) => {
            // Permite apenas números
            if (isNaN(e.key)) {
                e.preventDefault();
            }
        });

        telefoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, ''); // Remove tudo que não é número
            value = value.replace(/^(\d{2})(\d)/g, '($1) $2'); // Coloca parênteses no DDD
            value = value.replace(/(\d)(\d{4})$/, '$1-$2'); // Coloca hífen no número
            e.target.value = value;
        });
    </script>
</body>
</html>
